[package]
name = "crossword_typst"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
# puz-parse = {version= "0.1.2", features = ["json"]}
puz-parse = {git = "https://github.com/VBenny42/puz.rs.git", branch = "fix-clue-checking", features = ["json"]}
serde_json = "1.0.150"
typst = "0.14.2"
typst-as-lib = { version = "0.15.5", features = ["typst-kit-fonts"] }
typst-pdf = "0.14.2"
